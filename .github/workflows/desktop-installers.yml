name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact: windows-installer
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
            checksum: src-tauri/target/release/bundle/SHA256SUMS-windows.txt
          - platform: macos-apple-silicon
            os: macos-latest
            bundles: dmg
            artifact: macos-apple-silicon-installer
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
            checksum: src-tauri/target/release/bundle/SHA256SUMS-macos-apple-silicon.txt
          - platform: macos-intel
            os: macos-15-intel
            bundles: dmg
            artifact: macos-intel-installer
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
            checksum: src-tauri/target/release/bundle/SHA256SUMS-macos-intel.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Build installer
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: Write installer checksums
        run: node scripts/write-checksums.mjs src-tauri/target/release/bundle "${{ matrix.platform }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.paths }}
            ${{ matrix.checksum }}
          if-no-files-found: error

      - name: Add installers to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ matrix.paths }}
            ${{ matrix.checksum }}
