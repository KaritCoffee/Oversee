name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            node_arch: x64
            bundles: nsis
            bundle_directory: nsis
            extension: .exe
            output_suffix: windows-x64-unsigned-setup.exe
          - platform: macos-arm64
            os: macos-latest
            node_arch: arm64
            bundles: dmg
            bundle_directory: dmg
            extension: .dmg
            output_suffix: macos-arm64-unsigned.dmg
          - platform: macos-x64
            os: macos-15-intel
            node_arch: x64
            bundles: dmg
            bundle_directory: dmg
            extension: .dmg
            output_suffix: macos-x64-unsigned.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Resolve and verify release version
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = require("./package.json").version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`package.json must contain a stable X.Y.Z version, received ${version}`);
          }
          if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version v${version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          PLATFORM_LABEL: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          if (process.arch !== process.env.EXPECTED_NODE_ARCH) {
            throw new Error(
              `Refusing to label ${process.env.PLATFORM_LABEL}: expected ${process.env.EXPECTED_NODE_ARCH}, runner is ${process.arch}`,
            );
          }
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript and synchronized version metadata
        run: npm run check

      - name: Build installer
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: Stage versioned unsigned installer and checksum
        id: package
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          PLATFORM_LABEL: ${{ matrix.platform }}
          BUNDLE_DIRECTORY: ${{ matrix.bundle_directory }}
          INSTALLER_EXTENSION: ${{ matrix.extension }}
          OUTPUT_SUFFIX: ${{ matrix.output_suffix }}
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.APP_VERSION;
          const platform = process.env.PLATFORM_LABEL;
          const extension = process.env.INSTALLER_EXTENSION.toLowerCase();
          const sourceDirectory = path.resolve(
            "src-tauri",
            "target",
            "release",
            "bundle",
            process.env.BUNDLE_DIRECTORY,
          );
          const outputDirectory = path.resolve("release-artifacts");

          if (!fs.existsSync(sourceDirectory)) throw new Error(`Bundle directory does not exist: ${sourceDirectory}`);
          const installers = fs
            .readdirSync(sourceDirectory, { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => path.join(sourceDirectory, entry.name))
            .filter((file) => path.extname(file).toLowerCase() === extension && path.basename(file).includes(version));
          if (installers.length !== 1) {
            throw new Error(`Expected exactly one ${version} ${extension} installer, found ${installers.length}`);
          }

          fs.mkdirSync(outputDirectory, { recursive: true });
          const installerName = `Oversee_${version}_${process.env.OUTPUT_SUFFIX}`;
          const installerPath = path.join(outputDirectory, installerName);
          fs.copyFileSync(installers[0], installerPath);

          const digest = crypto.createHash("sha256").update(fs.readFileSync(installerPath)).digest("hex");
          const checksumName = `Oversee_${version}_${platform}_unsigned_SHA256SUMS.txt`;
          fs.writeFileSync(path.join(outputDirectory, checksumName), `${digest}  ${installerName}\n`, "utf8");

          const trustName = `Oversee_${version}_${platform}_UNSIGNED.txt`;
          fs.writeFileSync(
            path.join(outputDirectory, trustName),
            [
              `Oversee ${version}`,
              `Platform: ${platform}`,
              `Source commit: ${process.env.GITHUB_SHA}`,
              "Trust status: unsigned automated test build",
              "This file is not Authenticode signed, Apple Developer ID signed, or Apple notarized.",
              `Verify the installer with ${checksumName} before opening it.`,
              "",
            ].join("\n"),
            "utf8",
          );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=Oversee-${version}-${platform}-unsigned\n`);
          NODE

      - name: Upload versioned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Verify and publish unsigned prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Oversee-*-unsigned
          path: release-assets
          merge-multiple: true

      - name: Re-verify installers and create aggregate checksum
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const match = process.env.GITHUB_REF_NAME.match(/^v(\d+\.\d+\.\d+)$/);
          if (!match) throw new Error(`Release tag must be vX.Y.Z, received ${process.env.GITHUB_REF_NAME}`);
          const version = match[1];
          const root = path.resolve("release-assets");
          const expected = [
            ["windows-x64", `Oversee_${version}_windows-x64-unsigned-setup.exe`],
            ["macos-arm64", `Oversee_${version}_macos-arm64-unsigned.dmg`],
            ["macos-x64", `Oversee_${version}_macos-x64-unsigned.dmg`],
          ];
          const aggregate = [];
          const allowedAssets = new Set();

          for (const [platform, installerName] of expected) {
            const installerPath = path.join(root, installerName);
            const checksumName = `Oversee_${version}_${platform}_unsigned_SHA256SUMS.txt`;
            const checksumPath = path.join(root, checksumName);
            const trustName = `Oversee_${version}_${platform}_UNSIGNED.txt`;
            const trustPath = path.join(root, trustName);
            for (const name of [installerName, checksumName, trustName]) allowedAssets.add(name);
            for (const required of [installerPath, checksumPath, trustPath]) {
              if (!fs.existsSync(required)) throw new Error(`Missing release asset: ${path.basename(required)}`);
            }

            const checksum = fs.readFileSync(checksumPath, "utf8").trim().match(/^([a-f0-9]{64})  (\S+)$/);
            if (!checksum || checksum[2] !== installerName) {
              throw new Error(`Malformed checksum file: ${checksumName}`);
            }
            const actual = crypto.createHash("sha256").update(fs.readFileSync(installerPath)).digest("hex");
            if (actual !== checksum[1]) throw new Error(`Checksum mismatch for ${installerName}`);
            aggregate.push({ digest: actual, name: installerName });
          }

          const downloadedAssets = fs
            .readdirSync(root, { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name);
          const unexpectedAssets = downloadedAssets.filter((name) => !allowedAssets.has(name));
          if (downloadedAssets.length !== allowedAssets.size || unexpectedAssets.length) {
            throw new Error(`Unexpected release assets: ${unexpectedAssets.join(", ") || "asset count mismatch"}`);
          }

          fs.writeFileSync(
            path.join(root, `Oversee_${version}_unsigned_SHA256SUMS.txt`),
            `${aggregate
              .sort((left, right) => left.name.localeCompare(right.name))
              .map(({ digest, name }) => `${digest}  ${name}`)
              .join("\n")}\n`,
            "utf8",
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Publish tagged unsigned prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Oversee v${{ steps.release.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > [!WARNING]
            > These are automated **unsigned test builds**. The Windows installer is not Authenticode signed. The macOS DMGs are not Apple Developer ID signed or notarized and may be blocked by Gatekeeper. Verify the matching SHA-256 checksum before opening an installer.

            Signed production distribution and automatic updates are not configured for this release.
          files: release-assets/*
